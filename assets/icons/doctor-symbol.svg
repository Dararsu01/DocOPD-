<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Outer Medical Badge -->
  <circle cx="256" cy="256" r="236" fill="url(#medGrad)" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.4"/>
  
  <!-- Medical White Cross -->
  <path d="M196 96 h120 v100 h100 v120 h-100 v100 h-120 v-100 h-100 v-120 h100 z" fill="#ffffff" rx="16"/>
  
  <!-- Rod of Asclepius / Stethoscope Staff -->
  <!-- Central Rod -->
  <rect x="246" y="116" width="20" height="280" rx="10" fill="#0d9488"/>
  <!-- Gold Top Emblem -->
  <circle cx="256" cy="116" r="22" fill="#f59e0b"/>
  
  <!-- Asclepius Snake / Stethoscope Coils -->
  <path d="M 230,160 C 290,180 290,210 256,230 C 220,250 220,280 256,300 C 290,320 290,350 240,370" 
        fill="none" stroke="#0f766e" stroke-width="14" stroke-linecap="round"/>
        
  <!-- Caduceus Wing Tips or Stethoscope Earpieces -->
  <path d="M 210,135 Q 230,110 256,125 Q 282,110 302,135" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
</svg>
